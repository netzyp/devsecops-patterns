name: Using triggers workflow

on:
# Run on pushes to main or develop
  push:
   branches: 
      - main
      - develop

# Run on pull requests targeting main
  pull_request:
    branches:
      - main


  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:


jobs:
  test: 
    runs-on: ubuntu-latest

    steps:
     - name: Triggers and branches
       run: echo "Triggered pipeline"
